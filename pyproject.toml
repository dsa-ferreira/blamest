[project]
name = "blamest"
version = "0.1.0"
description = "A light-hearted terminal leaderboard of who-did-what in a GitHub repository"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["textual>=0.86", "tomlkit>=0.13"]

[project.scripts]
blamest = "blamest.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
